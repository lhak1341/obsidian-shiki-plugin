name: Run Checks and Tests on PR

on: pull_request

jobs:
    check:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Install Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.0

            - name: Install Dependencies
              id: build
              run: |
                  bun install --frozen-lockfile

            - name: Run Checks
              run: |
                  bun run check
